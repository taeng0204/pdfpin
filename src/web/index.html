<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pdfpin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- the app icon, cropped to its tile: at 16px a glyph floating in padding is a smudge -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%23f5f5f3'/%3E%3Cpath d='M14.5 3.5 20.5 9.5 17 13l.5 4.5-3 1-3-3.5L5 21l-1-1 6-6.5-3.5-3 1-3L12 8z' fill='%231b1b1a'/%3E%3C/svg%3E">
<link rel="manifest" href="/assets/manifest.webmanifest">
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar" id="topbar">
    <div class="tb-left">
      <button class="icon-btn" id="history-toggle" title="Documents (l)" aria-pressed="false"></button>
      <a class="brand" href="/" title="pdfpin home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5 20.5 9.5 17 13l.5 4.5-3 1-3-3.5L5 21l-1-1 6-6.5-3.5-3 1-3L12 8z" fill="currentColor"/></svg>
        <span>pdfpin</span>
      </a>
      <h1 class="doc-title" id="doc-title" title="">Loading…</h1>
    </div>
    <div class="tb-center">
      <div class="search" id="search" data-open="false">
        <button class="icon-btn search-open" id="search-open" title="Search in document (⌘F / Ctrl+F)"></button>
        <input id="search-input" type="search" placeholder="Search in document…" autocomplete="off" spellcheck="false">
        <span class="search-count" id="search-count"></span>
        <button class="icon-btn" id="search-prev" title="Previous (Shift+Enter)"></button>
        <button class="icon-btn" id="search-next" title="Next (Enter)"></button>
        <button class="icon-btn" id="search-close" title="Close (Esc)"></button>
      </div>
    </div>
    <div class="tb-right">
      <div class="pager" title="Page">
        <input id="page-input" inputmode="numeric" value="1" aria-label="Current page">
        <span class="pager-sep">/</span><span id="page-count">–</span>
      </div>
      <div class="zoom">
        <button class="icon-btn" id="zoom-out" title="Zoom out (⌘−)"></button>
        <button class="zoom-label" id="zoom-label" title="Reset to fit width (⌘0)">100%</button>
        <button class="icon-btn" id="zoom-in" title="Zoom in (⌘+)"></button>
      </div>
      <button class="icon-btn" id="fit-toggle" title="Fit page / fit width"></button>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme"></button>
      <button class="icon-btn" id="settings-toggle" title="Settings"></button>
      <button class="icon-btn" id="panel-toggle" title="Toggle notes panel (t)" aria-pressed="true"></button>
      <span class="conn" id="conn" data-state="connecting" title="Connecting…"></span>
    </div>
  </header>

  <main class="main" id="main">
    <div class="viewer-wrap">
      <section class="viewer" id="viewer" tabindex="-1">
        <div class="pages" id="pages"></div>
        <div class="loading" id="loading"><div class="spinner"></div><span id="loading-text">Opening document…</span></div>
        <div class="welcome" id="welcome" hidden>
          <h2 id="welcome-title"></h2>
          <p id="welcome-step1"></p>
          <div class="welcome-actions">
            <button class="btn primary" id="welcome-tour" hidden></button>
            <button class="btn" id="welcome-open"></button>
          </div>
          <p id="welcome-step2"></p>
          <p class="welcome-cli" id="welcome-cli"></p>
        </div>
      </section>
      <div class="strip" id="strip" hidden><div class="strip-view" id="strip-view"></div></div>
    </div>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-heading">History</span>
          <span class="count-badge" id="ann-count" title="sessions · highlights">0</span>
        </div>
        <div class="panel-actions">
          <button class="icon-btn" id="group-btn" title="Group by tag" aria-pressed="false"></button>
          <button class="icon-btn" id="tags-btn" title="Manage tags"></button>
          <button class="icon-btn" id="archive-btn" title="Archived sessions"></button>
          <button class="icon-btn" id="export-btn" title="Export…"></button>
          <button class="icon-btn" id="copy-all-btn" title="Copy all notes as Markdown"></button>
        </div>
      </div>
      <div class="summary" id="summary" hidden></div>
      <div class="filters" id="filters">
        <div class="filter-search">
          <input id="filter-input" type="search" placeholder="Filter notes…" autocomplete="off" spellcheck="false">
        </div>
        <div class="chips" id="tag-chips"></div>
        <div class="color-filter" id="color-filter"></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="panel-foot">
        <label class="switch" id="dim-row" hidden><input type="checkbox" id="dim-toggle"><span>Dim pages</span></label>
        <span class="hint">n / p · next / prev note</span>
      </div>
    </aside>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Document history" hidden>
    <div class="drawer-head">
      <span class="panel-heading">Documents</span>
      <span class="count-badge" id="history-count">0</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="open-doc-btn" title="Open a PDF…"></button>
      <button class="icon-btn" id="drawer-close" title="Close (Esc)"></button>
    </div>
    <div class="drawer-search"><input id="history-filter" type="search" placeholder="Filter documents…" autocomplete="off" spellcheck="false"></div>
    <div class="drawer-list" id="history-list"></div>
    <div class="drawer-foot">Open another PDF from a terminal: <code>pdfpin open file.pdf</code></div>
  </aside>
  <datalist id="tag-options"></datalist>
  <div id="popover" class="popover" hidden></div>
  <div id="sel-toolbar" class="sel-toolbar" hidden></div>
  <div class="update-notice" id="update-notice" role="status" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="export-menu" class="menu" hidden>
    <button data-format="pdf">Annotated PDF <small>real highlight annotations</small></button>
    <button data-format="md">Markdown report <small>quotes and notes per page</small></button>
  </div>
</div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
